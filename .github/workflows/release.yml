name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/ai4se-harness_windows_amd64.exe ./cmd/ai4se-harness
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/ai4se-harness_linux_amd64 ./cmd/ai4se-harness
          sha256sum dist/* > dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: demo
          push: true
          tags: ghcr.io/liu-ty/ai4se_coding_agent_harness:${{ github.ref_name }}
