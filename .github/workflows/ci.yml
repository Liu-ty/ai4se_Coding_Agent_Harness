name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test ./... -count=1

      - name: Run vet
        run: go vet ./...

      - name: Run race tests
        run: go test -race ./... -count=1

  unsupported-platform:
    name: Reject unsupported ${{ matrix.goos }}/amd64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - darwin
          - freebsd

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile unsupported-platform rejection tests
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: ${{ matrix.goos }}
        run: go test -c ./internal/executor -o "${RUNNER_TEMP}/executor-${{ matrix.goos }}.test"
